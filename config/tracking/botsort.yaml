# Tracker bench v1, candidate B (bench/ only; the product never reads this file).
# Published defaults of Roboflow `trackers` 2.7.0 BoTSORTTracker.__init__ (not tuned): camera motion compensation ON
# (sparse optical flow, downscale 2), no re-ID model (the published default). frame_rate comes from the video.
schema: spana.tracker_candidate
schema_version: 1.0.0
candidate: B
name: botsort_cmc
kind: online
implementation: {package: trackers, version: 2.7.0, class: BoTSORTTracker}
licence: {spdx: Apache-2.0, commercial_ok: true, source: "trackers 2.7.0 wheel METADATA + LICENSE"}
needs_image: true
needs_embeddings: false
params:
  lost_track_buffer: 30
  track_activation_threshold: 0.7
  minimum_consecutive_frames: 2
  minimum_iou_threshold_first_assoc: 0.2
  minimum_iou_threshold_second_assoc: 0.5
  minimum_iou_threshold_unconfirmed_assoc: 0.3
  high_conf_det_threshold: 0.6
  enable_cmc: true
  cmc_method: sparseOptFlow
  cmc_downscale: 2
  instant_first_frame_activation: true
