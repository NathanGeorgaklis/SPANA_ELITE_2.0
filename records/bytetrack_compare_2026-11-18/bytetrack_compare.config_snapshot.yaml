# DEV comparison only (tools/dev/bytetrack_compare.py): Roboflow supervision ByteTrack run on our own detections.
# Values = supervision 0.25.1 ByteTrack defaults (what the Roboflow Workflows "Byte Tracker" block uses unless changed);
# frame_rate is taken from the video, not from here. The product never reads this file.
schema: spana.bytetrack_compare_config
schema_version: 1.0.0
supervision_version: 0.25.1
bytetrack:
  track_activation_threshold: 0.25
  lost_track_buffer: 30          # frames at 30 fps; ByteTrack scales it by frame_rate / 30
  minimum_matching_threshold: 0.8
  minimum_consecutive_frames: 1
class_agnostic: true             # every person-view detection as one class, as our tracker uses them
