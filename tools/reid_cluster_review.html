<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPANA re-ID cluster review</title>
<style>
  :root { --bg:#111418; --panel:#1b2027; --line:#2c333d; --text:#e6e9ee; --muted:#8b95a3; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --acc:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); padding:8px 12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  input, select { background:#0d1014; color:var(--text); border:1px solid var(--line); padding:4px 6px; border-radius:4px; }
  button { background:#262c35; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 8px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.primary { background:#1f6feb; border-color:#1f6feb; }
  button.on { outline:2px solid var(--acc); }
  .muted { color:var(--muted); }
  .bad { color:var(--bad); } .ok { color:var(--ok); } .warn { color:var(--warn); }
  main { display:grid; grid-template-columns: 250px 1fr; gap:12px; padding:12px; }
  aside { position:sticky; top:62px; align-self:start; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px; max-height:calc(100vh - 80px); overflow:auto; }
  aside .player { display:flex; justify-content:space-between; padding:4px 6px; border-radius:4px; cursor:pointer; margin:2px 0; }
  aside .player.active { outline:2px solid var(--acc); }
  aside input, aside select { width:100%; margin:2px 0; }
  .swatch { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px; margin-bottom:12px; }
  .card.conflict { border-color:var(--bad); }
  .card h3 { margin:0 0 6px; font-size:14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row { display:flex; align-items:center; gap:8px; padding:3px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .row.over { opacity:.45; }
  .row img { height:84px; border-radius:3px; }
  .tag { padding:1px 6px; border-radius:10px; border:1px solid var(--line); font-size:11px; }
  .tag.c { border-color:var(--bad); color:var(--bad); }
  #status.bad { color:var(--bad); } #status.ok { color:var(--ok); } #status.warn { color:var(--warn); }
</style>
</head>
<body>
<header>
  <b>SPANA re-ID cluster review</b>
  <span id="match" class="muted"></span>
  <button id="tabClusters" class="on">Clusters</button>
  <button id="tabAudit">Audit</button>
  <select id="filter"><option value="all">all clusters</option><option value="open">undecided</option><option value="conflict">CONFLICT</option><option value="hidden">"not seen" tracklets</option></select>
  <button id="lock">Lock clusters &amp; start audit</button>
  <span id="progress" class="muted"></span>
  <button id="export" class="primary">Export frozen labels</button>
  <span id="status"></span>
</header>
<main>
  <aside>
    <div class="muted">Annotator</div><input id="annotator" placeholder="your name">
    <div class="muted" style="margin-top:6px">Label version / reason (version &gt; 1)</div>
    <input id="version" type="number" min="1" value="1"><input id="reason" placeholder="reason for a new version">
    <h4 style="margin:10px 0 4px">Players (this match)</h4>
    <div class="muted" style="font-size:11px">Click a player to make it active. "Assign" gives a whole cluster (or an audit tracklet) to the active player.</div>
    <input id="pkey" placeholder="key, e.g. A7"><select id="pside"><option>A</option><option>B</option><option>GK_A</option><option>GK_B</option><option>REF</option><option>OTHER</option></select>
    <input id="pnum" placeholder="shirt number (optional)"><button id="padd" style="width:100%">Add player</button>
    <div id="players"></div>
    <h4 style="margin:10px 0 4px">Summary</h4><div id="summary" class="muted"></div>
  </aside>
  <section id="view"></section>
</main>
<script src="review.js"></script>
<script>
"use strict";
const R = window.SPANA_CLUSTER_REVIEW;
const $ = id => document.getElementById(id);
function status(msg, cls) { const s = $("status"); s.textContent = msg; s.className = cls || ""; }
if (!R || !R.clusters) { status("review.js missing: open index.html from inside a cluster review folder.", "bad"); throw new Error("no review"); }
const PREFIX = "spana_reid_cluster_" + R.tracklets_sha256 + "_", KEY = PREFIX + R.config_sha256;
const COLORS = ["#58a6ff","#3fb950","#d29922","#f778ba","#a371f7","#39c5cf","#ff7b72","#e3b341","#7ee787","#79c0ff","#ffa657","#d2a8ff"];
const TL = Object.fromEntries(R.tracklets.map(t => [t.id, t]));
const EXCL = new Set(R.excluded), HIDDEN = new Set(R.previously_hidden || []);
const AC = R.config.audit;
const ODD = {}; for (const c of Object.values(R.clusters)) c.tracklets.forEach((t, i) => ODD[t] = c.odd[i]);
const FRAMES = Object.fromEntries(R.tracklets.map(t => [t.id, new Set(t.frames)]));
function fresh() {
  return { players: {}, annotator: "", version: 1, reason: "", members: Object.fromEntries(Object.entries(R.clusters).map(([k, c]) => [k, c.tracklets.slice()])),
           cdec: {}, overrides: {}, audit: {}, locked: false, next: Object.keys(R.clusters).length + 1 };
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && s.members ? s : null; } catch (e) { return null; } }
function migrate() {     // progress saved under an earlier config of the same review
  // the most recent kind wins: a state with a lock (post-review audit, kept as is) over a 1.0.0 state (its
  // build-time audit was a different sample: dropped, kept only as "earlier audit answer"); then the most answers
  let best = null;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i); if (!k || !k.startsWith(PREFIX) || k === KEY) continue;
      const o = JSON.parse(localStorage.getItem(k)); if (!o || !o.members) continue;
      const rank = [("locked" in o) ? 1 : 0, Object.keys(o.audit || {}).length];
      if (!best || rank[0] > best.rank[0] || (rank[0] === best.rank[0] && rank[1] > best.rank[1])) best = { k, o, rank };
    }
  } catch (e) { /* storage unavailable */ }
  if (!best) return null;
  const o = best.o, post = best.rank[0] === 1;
  return { players: o.players || {}, annotator: o.annotator || "", version: o.version || 1, reason: o.reason || "", members: o.members,
           cdec: o.cdec || {}, overrides: o.overrides || {}, audit: post ? (o.audit || {}) : {}, locked: post ? !!o.locked : false,
           next: o.next || Object.keys(o.members).length + 1, prevAudit: post ? (o.prevAudit || {}) : (o.audit || {}), migrated_from: best.k };
}
let S = load(), active = null, tab = "clusters", selected = new Set(), migrated = false;
if (!S) { S = migrate(); migrated = !!S; if (!S) S = fresh(); }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { status("Browser storage unavailable: export often.", "warn"); } }
if (migrated) persist();
function color(p) { const keys = Object.keys(S.players).sort(); return COLORS[keys.indexOf(p) % COLORS.length]; }
function overlap(a, b) { const A = FRAMES[a], B = FRAMES[b]; const [s, l] = A.size < B.size ? [A, B] : [B, A]; for (const f of s) if (l.has(f)) return true; return false; }

// ---- decisions: excluded -> unsure; a tracklet override wins over its cluster; audit answers win for audited tracklets
function clusterOf(tid) { for (const [k, m] of Object.entries(S.members)) if (m.includes(tid)) return k; return null; }
function derived(tid) {
  if (EXCL.has(tid)) return { decision: "unsure", player: null };
  if (S.overrides[tid]) return { decision: S.overrides[tid].decision, player: null };
  const d = S.cdec[clusterOf(tid)]; return d ? { decision: d.decision, player: d.decision === "player" ? d.player : null } : null;
}
function live(cid) { return S.members[cid].filter(t => !S.overrides[t]); }
function needsDecision(cid) { return live(cid).length > 0; }
// freeze rule confirmed_only (tools/reid_cluster.py final_decisions): a player label is frozen only where you gave it
// directly (an audit answer, or a single-tracklet cluster); an unaudited tracklet of a multi-tracklet player cluster
// is frozen as unsure (status unconfirmed_cluster_label)
function finalD(tid) {
  if (S.locked && auditPrefix().prefix.includes(tid)) return S.audit[tid];
  const d = derived(tid), c = clusterOf(tid);
  if (d && d.decision === "player" && !EXCL.has(tid) && c && live(c).length > 1) return { decision: "unsure", player: null, unconfirmed: true };
  return d;
}
function conflicts() {           // cluster ids in CONFLICT: two live members on one frame, or a player in two places
  const bad = new Set();
  for (const cid of Object.keys(S.members)) { const L = live(cid); outer: for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++) if (overlap(L[i], L[j])) { bad.add(cid); break outer; } }
  const byP = {};
  for (const t of R.tracklets) { const d = finalD(t.id); if (d && d.decision === "player") (byP[d.player] = byP[d.player] || []).push(t.id); }
  for (const ts of Object.values(byP)) for (let i = 0; i < ts.length; i++) for (let j = i + 1; j < ts.length; j++)
    if (overlap(ts[i], ts[j])) { for (const t of [ts[i], ts[j]]) { const c = clusterOf(t); if (c) bad.add(c); } }
  return bad;
}
// a split / move changes a cluster: its decision is cleared and must be confirmed again
function clearDecision(...cids) { let n = 0; for (const c of cids) if (c && S.cdec[c]) { delete S.cdec[c]; n++; } if (n) status("Cluster changed: its decision was cleared, confirm it again.", "warn"); }

// ---- audit (same rules as tools/reid_cluster.py): after the lock, player clusters with a live mate, fixed order
function fnv1a32(text) { let h = 0x811c9dc5; for (const b of new TextEncoder().encode(text)) { h ^= b; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function auditOrder() {
  const el = [];
  for (const [cid, m] of Object.entries(S.members)) { const d = S.cdec[cid], L = live(cid); if (d && d.decision === "player" && L.length >= 2) el.push(...L); }
  const key = t => fnv1a32(AC.seed + ":" + t);
  return el.sort().map(t => [key(t), t]).sort((a, b) => a[0] - b[0] || (a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0)).map(x => x[1]);
}
function auditPrefix() {           // answers form a prefix of the draw order; the next one is shown until all are done
  const order = auditOrder();
  for (let k = 0; k < order.length; k++) if (!S.audit[order[k]]) return { order, prefix: order.slice(0, k), next: order[k], complete: false };
  return { order, prefix: order.slice(), next: null, complete: true };
}
function binomCdf(k, n, p) { let s = 0, c = 1; for (let i = 0; i <= k; i++) { if (i > 0) c = c * (n - i + 1) / i; s += c * Math.pow(p, i) * Math.pow(1 - p, n - i); } return s; }
function upperBound(k, n, conf) { if (!n) return null; if (k >= n) return 1; let lo = k / n, hi = 1; for (let i = 0; i < 100; i++) { const m = (lo + hi) / 2; if (binomCdf(k, n, m) > 1 - conf) lo = m; else hi = m; } return hi; }
function auditStats() {
  const P = auditPrefix(); let comparable = 0, dis = 0, lost = 0;
  for (const t of P.prefix) { const a = S.audit[t], d = derived(t);
    if (a.decision !== "player") { lost++; continue; }
    comparable++; if (!d || d.decision !== "player" || d.player !== a.player) dis++; }
  return { ...P, comparable, dis, lost, upper: upperBound(dis, comparable, AC.confidence) };
}

function img(t, k) { const im = document.createElement("img"); im.src = TL[t].thumbs[k]; im.loading = "lazy"; return im; }
function sheetThumbs(t) { const n = TL[t].thumbs.length, m = Math.min(n, R.config.review.sheet_thumbs_per_tracklet); const out = []; for (let i = 0; i < m; i++) out.push(Math.round(i * (n - 1) / Math.max(1, m - 1))); return [...new Set(out)]; }
function decLabel(d) { return !d ? '<span class="muted">undecided</span>' : d.decision === "player" ? `<b style="color:${color(d.player)}">${d.player}</b>` : `<b>${d.decision.toUpperCase()}</b>`; }
function btn(txt, fn) { const b = document.createElement("button"); b.textContent = txt; b.onclick = fn; return b; }
function pct(x) { return x === null ? "-" : (100 * x).toFixed(1) + " %"; }

function renderPlayers() {
  const el = $("players"); el.innerHTML = "";
  for (const k of Object.keys(S.players).sort()) {
    const p = S.players[k], d = document.createElement("div");
    d.className = "player" + (active === k ? " active" : "");
    d.innerHTML = `<span><span class="swatch" style="background:${color(k)}"></span>${k} <span class="muted">${p.side}${p.shirt_number ? " #" + p.shirt_number : ""}</span></span>`;
    d.onclick = () => { active = k; render(); };
    el.appendChild(d);
  }
}
function renderClusters(bad) {
  const v = $("view"), filt = $("filter").value; v.innerHTML = "";
  const note = document.createElement("div"); note.className = "muted"; note.style.margin = "0 0 8px";
  note.textContent = `${R.excluded.length} tracker-flagged tracklets excluded (${R.excluded_status}: decided, not trained on).` +
    (HIDDEN.size ? ` ${HIDDEN.size} tracklets were hidden during your earlier review (marked "not seen"): check their clusters.` : "") +
    (S.locked ? " Clusters are LOCKED for the audit; unlock to edit (this discards audit answers)." : "");
  v.appendChild(note);
  for (const cid of Object.keys(S.members)) {
    const mem = S.members[cid];
    const d = S.cdec[cid], isBad = bad.has(cid), open = !d && needsDecision(cid), hid = mem.some(t => HIDDEN.has(t));
    if ((filt === "open" && !open) || (filt === "conflict" && !isBad) || (filt === "hidden" && !hid)) continue;
    const card = document.createElement("div"); card.className = "card" + (isBad ? " conflict" : ""); card.dataset.cid = cid;
    const h = document.createElement("h3");
    h.innerHTML = `${cid} <span class="muted">${mem.length} tracklets</span> ${decLabel(d)} ${isBad ? '<span class="tag c">CONFLICT: same frame or player in two places</span>' : ""}${hid ? ' <span class="tag">has a "not seen" tracklet</span>' : ""}`;
    if (!S.locked) {
      h.appendChild(btn("Assign cluster to active player", () => { if (!active) return status("Select a player on the left first.", "warn"); S.cdec[cid] = { decision: "player", player: active }; persist(); render(); }));
      h.appendChild(btn("Reject cluster", () => { S.cdec[cid] = { decision: "reject", player: null }; persist(); render(); }));
      h.appendChild(btn("Unsure cluster", () => { S.cdec[cid] = { decision: "unsure", player: null }; persist(); render(); }));
      h.appendChild(btn("Clear", () => { delete S.cdec[cid]; persist(); render(); }));
      h.appendChild(btn("Split selected → new cluster", () => {
        const sel = mem.filter(t => selected.has(t)); if (!sel.length) return status("Tick tracklets in this cluster first.", "warn");
        const nid = "C" + String(S.next++).padStart(3, "0") + "s"; S.members[nid] = sel; S.members[cid] = S.members[cid].filter(t => !sel.includes(t));
        sel.forEach(t => selected.delete(t)); clearDecision(cid); persist(); render(); }));
    }
    card.appendChild(h);
    for (const t of mem) {
      const row = document.createElement("div"); row.className = "row" + (S.overrides[t] ? " over" : "");
      if (!S.locked) { const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = selected.has(t); cb.onchange = () => cb.checked ? selected.add(t) : selected.delete(t); row.appendChild(cb); }
      for (const k of sheetThumbs(t)) row.appendChild(img(t, k));
      const info = document.createElement("span"); info.className = "muted";
      const prev = (S.prevAudit || {})[t];
      info.innerHTML = `${t} · ${TL[t].observed} obs · odd ${ODD[t] !== undefined ? ODD[t].toFixed(3) : "-"}${S.overrides[t] ? ` · <b>${S.overrides[t].decision.toUpperCase()}</b>` : ""}` +
        (HIDDEN.has(t) ? ` · <span class="tag">not seen in your review</span>` : "") + (prev ? ` · your earlier audit answer: ${decLabel(prev)}` : "");
      row.appendChild(info);
      if (!S.locked) {
        row.appendChild(btn("Reject", () => { S.overrides[t] = { decision: "reject" }; persist(); render(); }));
        row.appendChild(btn("Unsure", () => { S.overrides[t] = { decision: "unsure" }; persist(); render(); }));
        if (S.overrides[t]) row.appendChild(btn("Clear", () => { delete S.overrides[t]; persist(); render(); }));
        const mv = document.createElement("select");
        mv.innerHTML = `<option value="">move to…</option><option value="__new">new cluster</option>` + Object.keys(S.members).filter(k => k !== cid).map(k => `<option>${k}</option>`).join("");
        mv.onchange = () => { const to = mv.value; if (!to) return; const dest = to === "__new" ? "C" + String(S.next++).padStart(3, "0") + "s" : to;
          S.members[cid] = S.members[cid].filter(x => x !== t); (S.members[dest] = S.members[dest] || []).push(t); clearDecision(cid, dest); persist(); render(); };
        row.appendChild(mv);
      }
      card.appendChild(row);
    }
    v.appendChild(card);
  }
}
function renderAudit() {
  const v = $("view"); v.innerHTML = "";
  const note = document.createElement("div"); note.className = "muted"; note.style.margin = "0 0 8px";
  if (!S.locked) { note.textContent = "The audit starts once every cluster is decided and there is no CONFLICT: press \"Lock clusters & start audit\"."; v.appendChild(note); return; }
  const a = auditStats();
  note.textContent = `Tracklets from your player clusters, one at a time, without their cluster. Say who it is (active player), or Reject / Unsure. ` +
    `${a.prefix.length} of ${a.order.length} answered. Your answers are what gets frozen; every tracklet of a multi-tracklet cluster you do not answer here is frozen as unsure (not trained on), so answering more keeps more data.`;
  v.appendChild(note);
  const show = a.prefix.concat(a.next ? [a.next] : []);
  show.slice().reverse().forEach(t => {
    const i = a.order.indexOf(t);
    const card = document.createElement("div"); card.className = "card"; card.dataset.audit = t;
    const h = document.createElement("h3"); h.innerHTML = `Audit ${i + 1} ${decLabel(S.audit[t])}`;
    h.appendChild(btn("Assign active player", () => { if (!active) return status("Select a player on the left first.", "warn"); S.audit[t] = { decision: "player", player: active }; persist(); render(); }));
    h.appendChild(btn("Reject", () => { S.audit[t] = { decision: "reject", player: null }; persist(); render(); }));
    h.appendChild(btn("Unsure", () => { S.audit[t] = { decision: "unsure", player: null }; persist(); render(); }));
    card.appendChild(h);
    const row = document.createElement("div"); row.className = "row";
    TL[t].thumbs.forEach((_, k) => row.appendChild(img(t, k)));
    card.appendChild(row); v.appendChild(card);
  });
  if (a.complete) { const d = document.createElement("div"); d.className = "ok"; d.textContent = "Every drawable tracklet answered."; v.prepend(d); }
}
function render() {
  for (const [k, c] of Object.entries(S.members)) if (!c.length) { delete S.members[k]; delete S.cdec[k]; }
  renderPlayers();
  const bad = conflicts();
  if (tab === "clusters") renderClusters(bad); else renderAudit();
  const cl = Object.keys(S.members).filter(needsDecision), dec = cl.filter(k => S.cdec[k]).length;
  const a = S.locked ? auditStats() : null;
  $("progress").textContent = `${dec}/${cl.length} clusters decided · ${bad.size} CONFLICT` + (a ? ` · audit ${a.prefix.length}/${a.order.length} answered` : "");
  $("tabAudit").textContent = a ? `Audit (${a.prefix.length}/${a.order.length})` : "Audit";
  $("lock").textContent = S.locked ? "Unlock clusters (discards audit answers)" : "Lock clusters & start audit";
  $("summary").innerHTML = `${R.stats.tracklets} tracklets · ${R.stats.clustered} clustered into ${R.stats.clusters} · ${R.stats.excluded} excluded` +
    (a && a.comparable ? `<br>Cluster quality (reported, not a gate): ${a.dis} of ${a.comparable} of your player answers differ from their cluster; ${(100 * AC.confidence).toFixed(0)} % upper bound ${pct(a.upper)} (reference ${pct(AC.report_max_disagreement_rate)} at ≥ ${AC.report_min_comparable})` +
     `<br>${a.order.length - a.prefix.length} tracklets of multi-tracklet player clusters not answered: frozen as unsure` : "");
}
$("tabClusters").onclick = () => { tab = "clusters"; $("tabClusters").className = "on"; $("tabAudit").className = ""; render(); };
$("tabAudit").onclick = () => { tab = "audit"; $("tabAudit").className = "on"; $("tabClusters").className = ""; render(); };
$("filter").onchange = render;
$("lock").onclick = () => {
  if (S.locked) { if (!confirm("Unlock the clusters? Your audit answers will be discarded.")) return; S.locked = false; S.audit = {}; persist(); render(); return; }
  const undecided = Object.keys(S.members).filter(k => needsDecision(k) && !S.cdec[k]);
  if (undecided.length) { status(`${undecided.length} clusters undecided: assign, reject or mark unsure first.`, "bad"); $("filter").value = "open"; tab = "clusters"; render(); return; }
  if (conflicts().size) { status("CONFLICT: resolve the red clusters first.", "bad"); $("filter").value = "conflict"; tab = "clusters"; render(); return; }
  S.locked = true; S.audit = {}; persist(); $("tabAudit").onclick();
};
$("annotator").value = S.annotator; $("annotator").oninput = e => { S.annotator = e.target.value; persist(); };
$("version").value = S.version; $("version").oninput = e => { S.version = e.target.value; persist(); };
$("reason").value = S.reason; $("reason").oninput = e => { S.reason = e.target.value; persist(); };
$("padd").onclick = () => {
  const k = $("pkey").value.trim(), side = $("pside").value, num = $("pnum").value.trim();
  if (!/^[A-Za-z0-9_-]{1,16}$/.test(k)) return status("Player key: 1-16 letters, digits, _ or -", "bad");
  if (S.players[k]) return status("Player " + k + " already exists", "warn");
  S.players[k] = { side, shirt_number: num || null }; active = k; $("pkey").value = ""; $("pnum").value = ""; persist(); render();
};
$("export").onclick = () => {
  if (!S.locked) { status("Lock the clusters and answer the audit first.", "bad"); return; }
  if (conflicts().size) { status("CONFLICT: a player is in two places (check your audit answers).", "bad"); return; }
  const a = auditStats();
  if (!a.complete && !confirm(`${a.order.length - a.prefix.length} tracklets of multi-tracklet player clusters are not answered and will be frozen as unsure (not trained on). Export anyway?`)) return;
  if (!String(S.annotator || "").trim()) return status("Annotator name required.", "bad");
  const v = parseInt(S.version || 1, 10);
  if (v > 1 && !String(S.reason || "").trim()) return status("A new version needs a reason.", "bad");
  const parts = R.tracklets.map(t => { const d = finalD(t.id); const p = { tracklet: t.id, first_frame: t.first_frame, last_frame: t.last_frame, decision: d.decision, player: d.decision === "player" ? d.player : null };
    if (EXCL.has(t.id)) p.status = R.excluded_status; else if (d.unconfirmed) p.status = "unconfirmed_cluster_label"; return p; });
  const used = new Set(parts.filter(o => o.decision === "player").map(o => o.player));
  const players = Object.fromEntries(Object.entries(S.players).filter(([k]) => used.has(k)));
  const clusters = Object.fromEntries(Object.entries(S.members).map(([k, m]) => [k, { tracklets: m, decision: S.cdec[k] ? S.cdec[k].decision : null, player: S.cdec[k] && S.cdec[k].decision === "player" ? S.cdec[k].player : null }]));
  const doc = { schema: "spana.reid_label_export", schema_version: "1.0.0", match_id: R.match.match_id, split: R.match.split,
    tracklets_sha256: R.tracklets_sha256, annotator: S.annotator.trim(), label_version: v, reason: S.reason || "",
    exported_utc: new Date().toISOString(), players, parts, labelling_flow: "cluster_confirm",
    cluster_review: { schema: R.schema, schema_version: R.schema_version, config_sha256: R.config_sha256, model_sha256: R.model_sha256,
      clusters, overrides: S.overrides, excluded: R.excluded, audit: Object.fromEntries(a.prefix.map(t => [t, S.audit[t]])) } };
  const el = document.createElement("a");
  el.href = URL.createObjectURL(new Blob([JSON.stringify(doc, null, 1)], { type: "application/json" }));
  el.download = `${R.match.match_id}_reid_v${v}.json`; el.click();
  status("Exported " + el.download + " — freeze it with tools/freeze_reid_labels.py", "ok");
};
$("match").textContent = `${R.match.match_id} · ${R.match.split}`;
render();
status(migrated ? (S.locked ? "Your review and audit answers were carried over to the new freeze rule (only your own answers become player labels)."
  : "Your earlier review was carried over (decisions kept; the old audit is discarded). Tracklets that were hidden are now marked \"not seen\".")
  : Object.keys(S.cdec).length ? "Progress restored from this browser." : "Add players, decide each cluster (odd ones out are at the top of each sheet), then lock and audit.", "ok");
</script>
</body>
